replicaCount: 1

image:
  repository: registry.ccdc.cn:5000/cia/cia-agentscope
  tag: '0.2.0'
  pullPolicy: IfNotPresent

# 内网仓库 registry.ccdc.cn:5000 需要认证，默认使用命名空间内预建的
# docker-register-secret（与 oia-admin chart 保持一致）；
# 本地开发或无需认证的环境请清空该列表。
imagePullSecrets:
  - name: docker-register-secret
nameOverride: ''
fullnameOverride: ''

containerPort: 7010

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ''

podAnnotations: {}
podLabels: {}
podSecurityContext: {}

# The current Dockerfile runs as root. Do not enable runAsNonRoot until the
# image declares a fixed non-root UID/GID and the SFS permissions are verified.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 7010
  # type=NodePort 时可指定固定节点端口（30000-32767），不配置则由集群自动分配
  # nodePort: 30110
  annotations: {}

# Optional frontend. Enable with examples/values-prod-web.yaml in addition to
# your existing backend production values. The backend replicaCount is separate.
web:
  enabled: false
  replicas: 2
  image:
    repository: registry.ccdc.cn:5000/oia-agentscope-web
    tag: '1.0.0'
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: docker-register-secret
  # This chart mounts a generated server config that listens on this port.
  containerPort: 80
  service:
    type: NodePort
    port: 6088
    nodePort: 30088
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  priorityClassName: ''
  clientMaxBodySize: 100m
  updateStrategy: {}
  podSecurityContext: {}
  containerSecurityContext: {}
  extraEnv: []
  serviceAccount:
    create: false
    name: ''
    automountServiceAccountToken: false
    annotations: {}
  nginx:
    root: /usr/share/nginx/html
    # Optional existing ConfigMap with a server snippet in key default.conf.
    # Its listen port and health endpoint must match containerPort/healthcheck.
    existingConfigMap: ''
  backend:
    # Empty values select this release's backend Service and service.port.
    serviceName: ''
    servicePort: 0
    # /api/chat -> /chat; native backend /api/auth/ and /api/v1/ stay unchanged.
    pathPrefix: /api
    stripPrefix: true
    preservePrefixes:
      - /api/auth/
      - /api/v1/
      - /api/presentation/
    # Keep returned file/share URLs on the frontend origin.
    directPrefixes:
      - /files/
      - /persist-files/
      - /message_share/
    readTimeoutSeconds: 3600
  log:
    persistence:
      enabled: false
      mountPath: /var/log/nginx
      annotations:
        helm.sh/resource-policy: keep
      persistentVolumeClaim:
        existingClaim: ''
        storageClass: nfs-client
        accessModes: ReadWriteMany
        size: 5Gi
        # Each replica gets its own <subPath>/<Pod name> log directory.
        subPath: ''

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 60

probes:
  startup:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30
    successThreshold: 1
  readiness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  liveness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

storage:
  # hostPath：各节点预挂载的本地目录（单副本/同路径节点可用）
  # pvc：由 chart 创建 PVC 并挂载（多副本需 ReadWriteMany，如 nfs-client）
  # existingClaim：复用已存在的 PVC
  type: hostPath
  hostPath: /app/dify/sfs
  mountPath: /data/session-files
  existingClaim: ''
  # storage.type=pvc 时的 PVC 规格（参考 oia-admin chart）
  pvc:
    # "-" 表示显式禁用动态供给（storageClassName: ""），留空用集群默认 StorageClass
    storageClass: nfs-client
    accessModes: ReadWriteMany
    size: 50Gi
    subPath: ''
    # helm.sh/resource-policy: keep 避免 uninstall 时误删数据卷
    annotations:
      helm.sh/resource-policy: keep

externalMysql:
  host: ''
  port: 3306
  user: ''
  database: agentscope

externalRedis:
  url: ''
  sessionTtl: 86400

opensandbox:
  domain: localhost:9080
  protocol: http
  useServerProxy: true
  image: registry.ccdc.cn:5000/python:3.13-slim
  resourceCpu: 100m
  resourceMemory: 128Mi
  workspaceTtl: 3600
  poolSize: 0
  poolRefill: true

logging:
  level: INFO
  dir: /app/logs

existingSecret:
  name: ''
  keys:
    mysqlPassword: MYSQL_PASSWORD
    jwtSecret: JWT_SECRET
    configEncryptionKey: CONFIG_ENCRYPTION_KEY
    opensandboxApiKey: OPENSANDBOX_API_KEY

# Development-only convenience. Production should keep create=false and use
# existingSecret.name. Do not commit real credentials here.
secret:
  create: false
  stringData:
    MYSQL_PASSWORD: ''
    JWT_SECRET: ''
    CONFIG_ENCRYPTION_KEY: ''
    OPENSANDBOX_API_KEY: ''

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
