{{- if .Values.secret.create }}
{{- $mysqlPassword := required "MYSQL_PASSWORD is required when secret.create=true" (index .Values.secret.stringData "MYSQL_PASSWORD") }}
{{- $jwtSecret := required "JWT_SECRET is required when secret.create=true" (index .Values.secret.stringData "JWT_SECRET") }}
{{- $configEncryptionKey := index .Values.secret.stringData "CONFIG_ENCRYPTION_KEY" }}
{{- $opensandboxApiKey := index .Values.secret.stringData "OPENSANDBOX_API_KEY" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cia-agentscope.fullname" . }}
  labels:
    {{- include "cia-agentscope.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecret.keys.mysqlPassword }}: {{ $mysqlPassword | quote }}
  {{ .Values.existingSecret.keys.jwtSecret }}: {{ $jwtSecret | quote }}
  {{- if $configEncryptionKey }}
  {{ .Values.existingSecret.keys.configEncryptionKey }}: {{ $configEncryptionKey | quote }}
  {{- end }}
  {{- if $opensandboxApiKey }}
  {{ .Values.existingSecret.keys.opensandboxApiKey }}: {{ $opensandboxApiKey | quote }}
  {{- end }}
{{- end }}
