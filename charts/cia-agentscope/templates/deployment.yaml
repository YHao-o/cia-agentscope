{{- if .Values.proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
{{ include "oia-agentscope.ud.annotations" . | indent 4 }}
    descriptions: nginx proxy
  labels:
    app: {{ .Release.Name }}
{{ include "oia-agentscope.labels" . | indent 4 }}
{{ include "oia-agentscope.ud.labels" . | indent 4 }}
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.proxy.replicas }}
  revisionHistoryLimit: {{ .Values.proxy.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  {{- if .Values.proxy.updateStrategy }}
  strategy: {{- toYaml .Values.proxy.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/proxy-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{ include "oia-agentscope.ud.annotations" . | indent 8 }}
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if .Values.proxy.priorityClassName }}
      priorityClassName: {{ .Values.proxy.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.proxy.serviceAccount.create }}
      serviceAccountName: {{ .Values.proxy.serviceAccount.name | default .Release.Name }}
      automountServiceAccountToken: {{ .Values.proxy.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- if .Values.image.proxy.pullSecrets }}
      imagePullSecrets:
      {{- range .Values.image.proxy.pullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- if .Values.proxy.podSecurityContext }}
      securityContext:
{{ toYaml .Values.proxy.podSecurityContext | indent 8 }}
      {{- end }}
      containers:
      - image: "{{ .Values.image.proxy.repository }}:{{ .Values.image.proxy.tag }}"
        imagePullPolicy: "{{ .Values.image.proxy.pullPolicy }}"
        name: nginx
        {{- if .Values.proxy.containerSecurityContext }}
        securityContext:
{{ toYaml .Values.proxy.containerSecurityContext | indent 10 }}
        {{- end }}
        {{- if .Values.proxy.extraEnv }}
        env:
          {{- toYaml .Values.proxy.extraEnv | nindent 8 }}
        {{- end }}
        ports:
          - name: http
            containerPort: 80
            protocol: TCP
        {{- if .Values.proxy.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.proxy.livenessProbe.path | default "/nginx-healthz" }}
            port: http
          initialDelaySeconds: {{ .Values.proxy.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.proxy.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.proxy.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.proxy.livenessProbe.failureThreshold }}
          successThreshold: {{ .Values.proxy.livenessProbe.successThreshold }}
        {{- end }}
        {{- if .Values.proxy.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.proxy.readinessProbe.path | default "/nginx-healthz" }}
            port: http
          initialDelaySeconds: {{ .Values.proxy.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.proxy.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.proxy.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.proxy.readinessProbe.failureThreshold }}
          successThreshold: {{ .Values.proxy.readinessProbe.successThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.proxy.resources | nindent 12 }}
        volumeMounts:
        - name: nginx
          mountPath: /etc/nginx/nginx.conf
          readOnly: true
          subPath: nginx.conf
        {{- if .Values.proxy.log.persistence.enabled }}
        - name: nginx-logs-disk
          mountPath: {{ .Values.proxy.log.persistence.mountPath | quote }}
          subPath: {{ .Values.proxy.log.persistence.persistentVolumeClaim.subPath | default "" }}
        {{- end }}
    {{- if and (.Values.nodeSelector) (not .Values.proxy.nodeSelector) }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
    {{- end }}
    {{- if .Values.proxy.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.proxy.nodeSelector | indent 8 }}
    {{- end }}
    {{- if and (.Values.affinity) (not .Values.proxy.affinity) }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
    {{- end }}
    {{- if .Values.proxy.affinity }}
      affinity:
{{ toYaml .Values.proxy.affinity | indent 8 }}
    {{- end }}
    {{- if and (.Values.tolerations) (not .Values.proxy.tolerations) }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
    {{- end }}
    {{- if .Values.proxy.tolerations }}
      tolerations:
{{ toYaml .Values.proxy.tolerations | indent 8 }}
    {{- end }}
      volumes:
      - name: nginx
        configMap:
          defaultMode: 420
          name: {{ .Release.Name }}
      {{- if .Values.proxy.log.persistence.enabled }}
      - name: nginx-logs-disk
        persistentVolumeClaim:
          claimName: {{ .Values.proxy.log.persistence.persistentVolumeClaim.existingClaim | default .Release.Name }}
      {{- end }}
{{- end }}
