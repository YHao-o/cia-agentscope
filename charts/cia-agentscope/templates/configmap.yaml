{{- if .Values.proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
{{ include "oia-agentscope.labels" . | indent 4 }}
data:
  nginx.conf: |-
    {{- include "oia-agentscope.nginx.config.nginx" . | indent 4 }}
{{- range $key, $value := .Values.extraConfigFiles }}
  {{ $key }}: |-
{{ $value | indent 4 }}
{{- end }}
{{- end }}
