{{/* Nginx 日志 PVC */}}
{{- if and .Values.proxy.enabled .Values.proxy.log.persistence.enabled (not .Values.proxy.log.persistence.persistentVolumeClaim.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
{{- with .Values.proxy.log.persistence.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
  labels:
{{ include "oia-agentscope.labels" . | indent 4 }}
spec:
  accessModes:
  - {{ .Values.proxy.log.persistence.persistentVolumeClaim.accessModes | quote }}
  {{- if .Values.proxy.log.persistence.persistentVolumeClaim.storageClass }}
    {{- if eq "-" .Values.proxy.log.persistence.persistentVolumeClaim.storageClass }}
  storageClassName: ""
    {{- else }}
  storageClassName: {{ .Values.proxy.log.persistence.persistentVolumeClaim.storageClass }}
    {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.proxy.log.persistence.persistentVolumeClaim.size }}
{{- end }}

