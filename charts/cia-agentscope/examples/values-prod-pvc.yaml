# PVC + NodePort 部署形态（参考 oia-admin chart 的团队标准）：
# - 存储改为动态创建的 NFS PVC（ReadWriteMany，多副本可共享 /data/session-files）
# - Service 以固定 NodePort 对外暴露
replicaCount: 2

image:
  repository: registry.ccdc.cn:5000/cia-agentscope
  tag: "20261013-1" # Replace with the immutable tag pushed to the internal registry.
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: docker-register-secret

service:
  type: NodePort
  port: 7010
  nodePort: 30110

storage:
  type: pvc
  mountPath: /data/session-files
  pvc:
    storageClass: nfs-client
    accessModes: ReadWriteMany
    size: 50Gi

externalMysql:
  host: mysql.database.svc.cluster.local
  port: 3306
  user: agentscope
  database: agentscope

externalRedis:
  url: redis://redis.cache.svc.cluster.local:6379/0
  sessionTtl: 86400

existingSecret:
  name: cia-agentscope-secrets

secret:
  create: false

opensandbox:
  domain: localhost:9080
  poolSize: 0

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector: {}
